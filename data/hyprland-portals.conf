# Same as /usr/share/xdg-desktop-portal/hyprland-portals.conf, plus the
# RemoteDesktop and Clipboard backends. A file here replaces the system one
# entirely.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.RemoteDesktop=hyprland-remote
org.freedesktop.impl.portal.Clipboard=hyprland-remote
